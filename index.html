:root{
  --cream:#FFF9EC;--navy:#2B2D42;--muted:#6B7280;--line:#E8DFCB;
  --coral:#FF6B6B;--orange:#FF9F1C;--teal:#2EC4B6;--blue:#3D8BFD;--purple:#9B5DE5;--pink:#F15BB5;--gold:#FFD23F;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:128px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--navy);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior-y:contain;padding-bottom:140px;
  background-image:radial-gradient(circle at 12% 8%,#ffe3a8 0 6px,transparent 7px),radial-gradient(circle at 88% 22%,#ffc6d9 0 5px,transparent 6px),radial-gradient(circle at 20% 60%,#c9e4ff 0 6px,transparent 7px),radial-gradient(circle at 80% 85%,#d8c9ff 0 5px,transparent 6px);}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.ic{display:block;width:100%;height:100%;overflow:visible}
.hidden{display:none!important}

/* ---------- barra superior ---------- */
.sticky{position:sticky;top:0;z-index:40}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
  background:linear-gradient(90deg,#4D96FF,#9B5DE5);color:#fff;box-shadow:0 4px 14px rgba(77,60,160,.25)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .bi{width:34px;height:34px;flex:none}
.brand b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:flex;align-items:center;gap:6px;background:#fff;color:var(--navy);border-radius:16px;padding:6px 12px 6px 8px;font-weight:700;font-size:.82rem;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tbtn .ti{width:30px;height:30px}
.tbtn.round{padding:6px;border-radius:50%}
.tbtn.round .ti{width:28px;height:28px}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--cream);border-bottom:2px solid var(--line);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:flex;align-items:center;gap:6px;border-radius:999px;background:#fff;border:2px solid var(--line);padding:5px 12px 5px 6px;font-weight:700;font-size:.82rem}
.nav button i{width:24px;height:24px;display:block}
.nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:780px;margin:0 auto}

/* ---------- tarjetas ---------- */
.card{margin:14px 12px;padding:14px;border-radius:26px;background:#fff;border:2px solid var(--line);box-shadow:0 8px 0 rgba(43,45,66,.05)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh .sicon{width:50px;height:50px;flex:none;cursor:pointer}
.sh h2{margin:0;font-size:1.22rem;line-height:1.15}
.sh small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.sh .grow{flex:1;min-width:0}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;color:#fff;font-weight:700;font-size:.8rem}

/* ---------- héroe / asistente ---------- */
.bubble{position:relative;margin:0 auto 12px;max-width:560px;background:#fff;border:3px solid var(--navy);border-radius:22px;padding:10px 14px;font-weight:600;font-size:1rem;line-height:1.35;box-shadow:0 5px 0 rgba(43,45,66,.12);min-height:3.4em;display:grid;place-items:center}
.bubble::after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:14px solid var(--navy);border-bottom:0}
.bubble::before{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:11px solid #fff;border-bottom:0;z-index:2}
.micbtn{display:flex;align-items:center;gap:8px;background:var(--coral);color:#fff;border-radius:999px;padding:8px 18px 8px 10px;font-weight:700;font-size:1rem;box-shadow:0 5px 0 #d94a4a}
.micbtn i{width:38px;height:38px;background:#fff;border-radius:50%;padding:5px;display:block}
.micbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #d94a4a}
.micbtn.live{animation:micPulse 1s infinite;background:#e63946}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(230,57,70,.6),0 5px 0 #a82733}100%{box-shadow:0 0 0 18px rgba(230,57,70,0),0 5px 0 #a82733}}
.askrow{display:flex;gap:8px;margin:12px auto 0;max-width:560px}
.askrow input{flex:1;min-width:0;border:3px solid var(--navy);border-radius:16px;padding:10px 12px;font-size:1rem;background:#fff;color:var(--navy)}
.askrow button{background:var(--navy);color:#fff;border-radius:16px;padding:0 16px;font-weight:700}
.qchips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none;margin:0 -2px}
.qchips::-webkit-scrollbar{display:none}
.qchips button{flex:none;background:#fff;border:2px solid #F0C37A;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.82rem;color:var(--navy)}
.qchips button:active{background:#FFE9B8}

/* ---------- avatar ---------- */
.av{width:100%;height:100%}
.av svg{width:100%;height:100%;overflow:visible}
.av .eye-dot{transform:translate(var(--ex,0px),var(--ey,0px)) scaleY(var(--eb,1));transform-box:fill-box;transform-origin:center;transition:transform .06s linear}
.av .m,.av .brow{display:none}
.av.mood-happy:not(.talking) .m-smile,.av.talking:not(.open) .m-smile{display:inline}
.av.mood-sad:not(.talking) .m-sad{display:inline}
.av.mood-sad:not(.talking) .m-smile{display:none}
.av.mood-wow:not(.talking) .m-wow{display:inline}
.av.mood-wow:not(.talking) .m-smile{display:none}
.av.talking.open .m-open{display:inline}
.av.mood-sad .brow{display:inline}
.av .arm{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.av.cheer .armL{transform:rotate(150deg)}.av.cheer .armR{transform:rotate(-150deg)}
.av.hold .armL{transform:rotate(-38deg)}.av.hold .armR{transform:rotate(38deg)}
.av .hold-star{display:none}.av.hold .hold-star{display:inline}
.bounce{animation:happyBounce .5s cubic-bezier(.28,.84,.42,1)}
@keyframes happyBounce{0%{transform:scale(1,1) translateY(0)}15%{transform:scale(1.15,.85) translateY(10px)}40%{transform:scale(.9,1.1) translateY(-45px)}60%{transform:scale(1.05,.95) translateY(0)}75%{transform:scale(.98,1.02) translateY(-10px)}100%{transform:scale(1,1) translateY(0)}}
.megabounce{animation:megaBounce .9s ease-in-out}
@keyframes megaBounce{0%{transform:translateY(0) scale(1)}12%{transform:translateY(8px) scale(1.12,.88)}30%{transform:translateY(-70px) scale(.9,1.12) rotate(-6deg)}50%{transform:translateY(0) scale(1.1,.9)}65%{transform:translateY(-40px) scale(.95,1.06) rotate(6deg)}85%{transform:translateY(0) scale(1.04,.96)}100%{transform:translateY(0) scale(1)}}
.heart{position:fixed;width:30px;height:30px;pointer-events:none;z-index:200;animation:floatUp 1.2s ease-in forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.5) rotate(0)}50%{opacity:1;transform:translateY(-70px) scale(1.2) rotate(15deg)}100%{opacity:0;transform:translateY(-130px) scale(1) rotate(-15deg)}}

/* ---------- semana ---------- */
.wk{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.wk .wtitle{flex:1;text-align:center;font-weight:700;font-size:.92rem}
.wk .wtitle small{display:block;color:var(--muted);font-weight:500;font-size:.72rem}
.wk .arrow{width:40px;height:40px;border-radius:50%;background:var(--cream);border:2px solid var(--line);font-size:1.1rem;font-weight:700}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dchip{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 7px;border-radius:16px;background:var(--cream);border:2px solid transparent;font-weight:700}
.dchip .dn{width:26px;height:20px;border-radius:10px;color:#fff;font-size:.72rem;display:grid;place-items:center;background:var(--c)}
.dchip .dd{font-size:1.02rem;line-height:1.1}
.dchip .dots{display:flex;gap:3px;height:8px}
.dchip .dots i{width:7px;height:7px;border-radius:50%;background:#e1dccb}
.dchip .dots i.on{background:var(--teal)}
.dchip .ds{width:16px;height:16px;opacity:.25;filter:grayscale(1)}
.dchip .ds.on{opacity:1;filter:none}
.dchip.sel{background:#fff;border-color:var(--c);box-shadow:0 4px 0 rgba(43,45,66,.1);transform:translateY(-2px)}
.dchip.today::after{content:"HOY";position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:.55rem;padding:1px 6px;border-radius:8px}
.dchip.future{opacity:.8}

/* ---------- horario ---------- */
.dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dayhead .pill{font-size:.95rem;padding:5px 16px}
.cal-chip{display:flex;align-items:center;gap:6px;background:#FFF3B0;border:2px solid #F2D45C;border-radius:999px;padding:3px 12px 3px 4px;font-weight:600;font-size:.78rem}
.cal-chip i{width:26px;height:26px;background:#fff;border-radius:50%;padding:2px;display:block}
.bar{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:700;font-size:.78rem;padding:5px 10px;margin:6px 0}
.bar i{width:22px;height:22px;display:block}
.bar.sun{background:#FFE49A}.bar.rec{background:#BDEBB4}
.per{display:flex;align-items:center;gap:10px;border-radius:18px;padding:7px 10px 7px 8px;margin:6px 0;cursor:pointer;position:relative;transition:transform .12s}
.per:active{transform:scale(.98)}
.per .pt{width:54px;flex:none;text-align:center;font-size:.7rem;line-height:1.25;font-weight:600}
.per .pt b{display:block;font-size:.85rem}
.per .pic{width:46px;height:46px;border-radius:50%;background:#fff;padding:5px;flex:none}
.per .ptxt{font-weight:700;font-size:1rem;line-height:1.15}
.per .ptxt small{display:block;font-weight:500;font-size:.74rem;opacity:.85;margin-top:1px}
.per.now{outline:4px solid #fff;box-shadow:0 0 0 7px var(--navy),0 0 18px 6px rgba(77,150,255,.65);animation:nowGlow 1.6s ease-in-out infinite}
@keyframes nowGlow{50%{box-shadow:0 0 0 7px var(--navy),0 0 26px 10px rgba(77,150,255,.9)}}
.per .tag{position:absolute;right:10px;top:-9px;background:var(--navy);color:#fff;border-radius:10px;font-size:.65rem;padding:2px 8px;font-weight:700}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;border-radius:22px;padding:10px 14px;font-weight:700;font-size:1.02rem;color:#fff;background:var(--teal);box-shadow:0 6px 0 #1b9186;text-align:left}
.bigbtn i{width:44px;height:44px;background:#fff;border-radius:50%;padding:5px;flex:none;display:block}
.bigbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #1b9186}
.bigbtn.done{background:#7ED957;box-shadow:0 6px 0 #4c9c2e}
.bigbtn.purple{background:var(--purple);box-shadow:0 6px 0 #6c3bb0}
.bigbtn.orange{background:var(--orange);box-shadow:0 6px 0 #c97800}
.bigbtn small{display:block;font-weight:500;font-size:.74rem;opacity:.95}
.linkbtn{display:block;margin:10px auto 0;font-weight:600;font-size:.82rem;color:var(--blue);text-decoration:underline;padding:6px}
.info{display:grid;gap:8px;margin-top:12px}
.info div{display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 10px;border:2px solid var(--line);font-size:.8rem}
.info i{width:34px;height:34px;display:block;flex:none}
.info b{display:block}

/* ---------- rutinas ---------- */
.prog{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.prog .track{flex:1;height:14px;border-radius:9px;background:#EFE8D6;overflow:hidden}
.prog .fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),#7ED957);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.prog b{font-size:.85rem;min-width:44px;text-align:right}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.rgrid{grid-template-columns:repeat(3,1fr)}}
.rc{position:relative;border-radius:24px;border:3px solid var(--a);background:var(--t);padding:10px 8px 12px;text-align:center;cursor:pointer;transition:transform .15s,background .25s}
.rc:active{transform:scale(.97)}
.rc .num{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:var(--a);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center;z-index:2}
.rc .icw{position:relative;width:94px;height:94px;margin:4px auto 4px;border-radius:50%;background:#fff;border:3px solid var(--a);padding:12px;cursor:pointer}
.rc .lab{font-weight:700;font-size:.95rem;min-height:2.5em;display:grid;place-items:center;line-height:1.15}
.rc .chk{width:48px;height:48px;border-radius:50%;border:3px dashed var(--a);background:#fff;margin:6px auto 0;display:grid;place-items:center;transition:transform .2s}
.rc .chk svg{width:30px;height:30px;opacity:0}
.rc .chk svg path{stroke-dasharray:30;stroke-dashoffset:30}
.rc.done{background:var(--a);color:#fff}
.rc.done .chk{border-style:solid;border-color:#fff;transform:scale(1.08)}
.rc.done .chk svg{opacity:1}
.rc.done .chk svg path{stroke-dashoffset:0;transition:stroke-dashoffset .4s .1s}
.rc.done .icw{border-color:#fff}
.rc .ok{position:absolute;top:6px;right:8px;font-size:.62rem;font-weight:700;background:#fff;color:var(--a);border-radius:10px;padding:1px 8px;opacity:0}
.rc.done .ok{opacity:1}
.sunday{margin:8px 0 2px;border-radius:18px;background:#FFF3B0;border:2px solid #F2D45C;padding:8px 12px;font-weight:600;font-size:.85rem;display:flex;gap:10px;align-items:center}
.sunday i{width:40px;height:40px;display:block;flex:none}

/* animaciones de íconos de tareas */
.anim-ring svg.ic{animation:aRing 1.25s ease-in-out}
@keyframes aRing{0%,100%{transform:none}5%{transform:translateY(-16px) rotate(-12deg)}13%{transform:translateY(-16px) rotate(12deg)}21%{transform:translateY(-12px) rotate(-12deg)}29%{transform:translateY(-12px) rotate(12deg)}37%{transform:translateY(-8px) rotate(-10deg)}45%{transform:translateY(-8px) rotate(10deg)}55%{transform:translateY(-4px) rotate(-7deg)}65%{transform:translateY(-2px) rotate(6deg)}78%{transform:translateY(0) rotate(-3deg)}}
.anim-wobble svg.ic{animation:aWob 1s ease-in-out}
@keyframes aWob{0%,100%{transform:none}18%{transform:rotate(-16deg) scale(1.12)}38%{transform:rotate(14deg) scale(1.08)}58%{transform:rotate(-9deg) scale(1.1)}78%{transform:rotate(5deg) scale(1.04)}}
.anim-munch svg.ic{animation:aMunch .5s ease-in-out 3}
@keyframes aMunch{0%,100%{transform:none}30%{transform:translateY(-9px) rotate(-7deg) scale(1.08,.94)}60%{transform:translateY(0) rotate(5deg) scale(.96,1.06)}}
.anim-brush svg.ic{transform-origin:70% 80%;animation:aBrush .35s ease-in-out 6 alternate}
@keyframes aBrush{0%{transform:rotate(-24deg) translateX(-6px)}100%{transform:rotate(24deg) translateX(6px)}}
.anim-scrub svg.ic{animation:aScrub .18s linear 9 alternate}
@keyframes aScrub{0%{transform:translateX(-7px) rotate(-4deg) scale(1.08)}100%{transform:translateX(7px) rotate(4deg) scale(1.08)}}
.anim-hop svg.ic{animation:aHop .9s ease-in-out}
@keyframes aHop{0%,100%{transform:none}20%{transform:translateY(-22px) rotate(-5deg) scale(.95,1.08)}40%{transform:translateY(0) scale(1.1,.9)}60%{transform:translateY(-16px) rotate(5deg)}80%{transform:translateY(0) scale(1.05,.95)}}
.anim-pop svg.ic{animation:aPop .85s cubic-bezier(.3,1.6,.5,1)}
@keyframes aPop{0%{transform:scale(.55) rotate(-10deg)}50%{transform:scale(1.28) rotate(6deg)}75%{transform:scale(.94) rotate(-3deg)}100%{transform:none}}
.anim-bounce svg.ic{animation:aBounce .8s ease-in-out}
@keyframes aBounce{0%,100%{transform:none}25%{transform:translateY(-24px) rotate(-8deg)}45%{transform:translateY(0) scale(1.14,.86)}65%{transform:translateY(-12px) rotate(6deg)}85%{transform:translateY(0) scale(1.05,.95)}}
.anim-sway svg.ic{animation:aSway 2.4s ease-in-out}
@keyframes aSway{0%,100%{transform:none}20%{transform:rotate(-16deg) translateY(-5px)}45%{transform:rotate(16deg) translateY(-9px)}70%{transform:rotate(-10deg) translateY(-4px)}}
.anim-wiggle svg.ic{animation:aWig .7s ease-in-out}
@keyframes aWig{0%,100%{transform:none}20%{transform:rotate(-14deg) scale(1.15)}45%{transform:rotate(12deg) scale(1.1)}70%{transform:rotate(-6deg) scale(1.05)}}
.particle{position:fixed;pointer-events:none;z-index:300;width:var(--s,14px);height:var(--s,14px);background:var(--c,#FFD23F);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:burst .9s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r,200deg))}}
.zz{position:fixed;pointer-events:none;z-index:300;font-weight:700;color:#7B5CD6;animation:zfloat 1.8s ease-out forwards}
@keyframes zfloat{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-90px) scale(1.4)}}

/* ---------- estrellas ---------- */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.sgrid{grid-template-columns:repeat(4,1fr)}}
.sc{position:relative;border-radius:22px;border:3px solid var(--c);background:#fff;text-align:center;padding:8px 6px 10px;cursor:pointer;transition:transform .15s}
.sc:active{transform:scale(.97)}
.sc .dp{display:inline-block;color:#fff;background:var(--c);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.85rem}
.sc .sw{position:relative;width:112px;height:112px;margin:6px auto 0}
.sc .sw svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sc .sw .fill{position:absolute;inset:0;opacity:0}.sc .sw .fill svg{width:100%;height:100%}
.sc.earned .sw .fill{opacity:1}
.sc.earned .sw .outline{opacity:.15}
.sc.neon .sw .outline polygon{stroke:#19F0FF;fill:rgba(25,240,255,.1);stroke-dasharray:none}.sc.neon .sw .outline{filter:drop-shadow(0 0 3px #19F0FF) drop-shadow(0 0 10px #19F0FF) drop-shadow(0 0 20px #FF3CF7);animation:neon 1.4s ease-in-out infinite alternate}
@keyframes neon{from{transform:scale(.97);opacity:.75}to{transform:scale(1.05);opacity:1}}
.sc.paint .sw .fill{animation:paintIn 1.1s ease-out both}
@keyframes paintIn{0%{clip-path:circle(0% at 50% 60%);opacity:1;transform:scale(.7)}60%{clip-path:circle(80% at 50% 60%);transform:scale(1.25) rotate(8deg)}100%{clip-path:circle(100% at 50% 60%);transform:scale(1)}}
.sc.locked{opacity:.55}
.sc .cap{font-size:.66rem;color:var(--muted);font-weight:600;margin-top:4px;min-height:1.3em}
.sc.neon .cap{color:#0aa6b3}
.sum{display:flex;align-items:center;gap:12px;margin-top:12px;border-radius:20px;background:#FFF1B8;border:2px solid #F2B705;padding:8px 12px}
.sum .big{font-size:1.9rem;font-weight:700;line-height:1}
.sum .txt{flex:1;font-weight:600;font-size:.88rem;line-height:1.2}
.trophybtn{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.72rem}
.trophybtn i{width:54px;height:54px;background:#fff;border:3px solid #F2B705;border-radius:50%;padding:7px;display:block;box-shadow:0 4px 0 #d49c00}
.trophybtn:active i{transform:translateY(3px);box-shadow:0 1px 0 #d49c00}

/* ---------- cuentos ---------- */
.stories{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:600px){.stories{grid-template-columns:repeat(3,1fr)}}
.story{border-radius:20px;border:3px solid var(--c);background:var(--t);padding:10px 8px;text-align:center;font-weight:700;font-size:.88rem;line-height:1.2}
.story i{display:block;width:62px;height:62px;margin:0 auto 6px;background:#fff;border-radius:50%;padding:8px;border:3px solid var(--c)}
.story small{display:block;font-weight:500;font-size:.7rem;color:var(--muted);margin-top:2px}
.story:active{transform:scale(.97)}

/* ---------- dock ---------- */
.dock.off{transform:translateY(160px);opacity:0}
.dock .db{pointer-events:auto;max-width:min(70vw,300px);background:#fff;border:3px solid var(--navy);border-radius:18px;padding:8px 12px;font-weight:600;font-size:.88rem;line-height:1.3;box-shadow:0 4px 0 rgba(43,45,66,.15);display:none}
.dock .db.show{display:block;animation:happyBounce .5s}
.dock .dbtn{pointer-events:auto;display:flex;align-items:flex-end;gap:6px}
.dock .dmic.live{animation:micPulse 1s infinite;background:#e63946}

/* ---------- hojas (calendario / ajustes) ---------- */
.sheet{position:fixed;inset:0;z-index:90;background:var(--cream);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.3,1,.4,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .sbar{display:flex;align-items:center;gap:10px;padding:12px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(90deg,#FF9F1C,#FF6B6B);color:#fff}
.sheet .sbar h3{margin:0;flex:1;font-size:1.15rem}
.sheet .sbar .x{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);font-weight:700;font-size:1.2rem;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.sheet .sbody{flex:1;overflow-y:auto;padding:12px;max-width:780px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mh b{flex:1;text-align:center;font-size:1.1rem}
.mh button{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);font-weight:700;font-size:1.1rem}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mg .wd{text-align:center;font-weight:700;font-size:.72rem;color:var(--muted);padding:2px 0}
.mc{position:relative;aspect-ratio:1/1.05;border-radius:14px;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3px;font-weight:700;font-size:.9rem}
.mc.out{opacity:.35}.mc.we{background:#FFF5E1}.mc.hol{background:#FFE0E0;border-color:#FF9B9B}
.mc.today{outline:3px solid var(--blue)}
.mc.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.mc .dts{display:flex;gap:2px;margin-top:auto;margin-bottom:4px;min-height:8px}
.mc .dts i{width:7px;height:7px;border-radius:50%}
.mc .ck{position:absolute;top:1px;right:3px;font-size:.62rem;color:var(--teal)}
.mc .stt{position:absolute;top:1px;left:2px;width:13px;height:13px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 2px;font-size:.7rem;font-weight:600;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:9px;height:9px;border-radius:50%;display:block}
.dpanel{margin-top:10px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px}
.dpanel h4{margin:0 0 8px;font-size:1rem}
.ev{display:flex;align-items:center;gap:8px;border-radius:14px;padding:7px 10px;margin:6px 0;font-weight:600;font-size:.88rem}
.ev i.d{width:12px;height:12px;border-radius:50%;flex:none}
.ev span{flex:1}
.ev button{width:32px;height:32px;border-radius:50%;background:#fff;font-weight:700;color:var(--coral);border:2px solid var(--line)}
.form{display:grid;gap:8px;margin-top:10px}
.form input[type=text]{border:3px solid var(--navy);border-radius:14px;padding:10px 12px;font-size:1rem}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchips button{border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.82rem;background:#fff}
.tchips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row label{flex:1;font-weight:600;font-size:.92rem}
.row input[type=text]{flex:1.4;border:3px solid var(--navy);border-radius:14px;padding:9px 12px;font-size:1rem;min-width:0}
.sw2{width:54px;height:30px;border-radius:999px;background:#d9d3c2;position:relative;transition:background .2s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:left .2s}
.sw2.on{background:var(--teal)}.sw2.on::after{left:27px}
.chars{display:flex;gap:10px;justify-content:center;margin:6px 0 4px}
.chars button{width:96px;border-radius:20px;border:4px solid var(--line);background:#fff;padding:4px 4px 6px;font-weight:700;font-size:.8rem}
.chars button .av{width:80px;height:80px;margin:0 auto}
.chars button.on{border-color:var(--purple);background:#F0E8FF}
.btn{display:block;width:100%;border-radius:18px;padding:12px;font-weight:700;font-size:1rem;color:#fff;background:var(--blue);box-shadow:0 5px 0 #2a63b8;margin-top:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2a63b8}
.btn.red{background:var(--coral);box-shadow:0 5px 0 #c94a4a}
.btn.gray{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.green{background:var(--teal);box-shadow:0 5px 0 #1b9186}
.hint{font-size:.78rem;color:var(--muted);font-weight:500;margin:4px 0}

/* ---------- escenario de celebración ---------- */
.stage{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(43,45,66,.62);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .25s}
.stage.open{opacity:1;visibility:visible}
.scard{position:relative;width:min(94vw,520px);max-height:96vh;overflow-y:auto;border-radius:34px;background:linear-gradient(180deg,#FFF6DA,#FFE3B0);border:4px solid #fff;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:14px 14px 16px;text-align:center}
.scard.good{background:linear-gradient(180deg,#E6FFF4,#BFF3DD)}
.scard.sad{background:linear-gradient(180deg,#EEF1FF,#D7DDFB)}
.scard.night{background:linear-gradient(180deg,#F0E8FF,#D8C9FF)}
.stitle{font-size:1.7rem;font-weight:700;line-height:1.1;margin:2px 0 4px;color:var(--navy);animation:happyBounce .7s}
.sstage{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:0 auto}
.sstage .sav{position:absolute;left:50%;bottom:0;width:70%;aspect-ratio:1;transform:translateX(-50%);cursor:pointer}
.sstage .bigstar{position:absolute;left:50%;top:62%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);display:none;z-index:3;filter:drop-shadow(0 0 10px #FFD23F)}
.sstage .bigstar.go{display:block;animation:starLaunch 1.5s cubic-bezier(.3,1.1,.5,1) forwards}
@keyframes starLaunch{0%{transform:translate(-50%,-50%) scale(.7)}30%{transform:translate(-50%,-190%) scale(1.2) rotate(120deg)}50%{transform:translate(-50%,-165%) scale(1.5) rotate(240deg)}100%{transform:translate(-50%,-170%) scale(2.3) rotate(360deg);filter:drop-shadow(0 0 18px #FFD23F) drop-shadow(0 0 40px #FF9F1C)}}
.sstage .bigstar.glow{display:block;animation:starPulse 1s ease-in-out infinite alternate;transform:translate(-50%,-170%) scale(2.3)}
@keyframes starPulse{from{transform:translate(-50%,-170%) scale(2.2)}to{transform:translate(-50%,-170%) scale(2.5) rotate(6deg)}}
.sbub{background:#fff;border:3px solid var(--navy);border-radius:20px;padding:10px 14px;font-weight:600;font-size:1.02rem;line-height:1.35;margin:8px 4px 0;box-shadow:0 4px 0 rgba(43,45,66,.12);position:relative}
.sbub::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-bottom:12px solid var(--navy);border-top:0}
.sextra{margin-top:10px}
.countdown{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0}
.countdown .n{width:86px;height:86px;border-radius:50%;background:var(--orange);color:#fff;font-size:3rem;font-weight:700;display:grid;place-items:center;border:5px solid #fff;box-shadow:0 6px 0 #c97800;animation:happyBounce .7s}
.countdown span{font-weight:700;font-size:1.05rem;text-align:left;line-height:1.15}
.prizeicons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.prizeicons i{width:74px;height:74px;display:block;background:#fff;border-radius:22px;padding:8px;border:3px solid #F2B705;animation:aPop .8s cubic-bezier(.3,1.6,.5,1) both}

function tint(hex, t) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = v => Math.round(v + (255 - v) * t);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}

/* ---------- fechas (lunes = 0). Parámetros de prueba: ?hoy=2026-10-23&hora=14:30 ---------- */
function nowReal() {
  const q = new URLSearchParams(location.search), h = q.get('hoy'), hr = q.get('hora');
  if (h) {
    const [y, m, d] = h.split('-').map(Number), t = new Date();
    let H = t.getHours(), Mi = t.getMinutes();
    if (hr) [H, Mi] = hr.split(':').map(Number);
    return new Date(y, m - 1, d, H, Mi, 0);
  }
  return new Date();
}
const p2 = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addD(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
function dow(s) { return (pd(s).getDay() + 6) % 7; }
function wstart(s) { return addD(s, -dow(s)); }
function todayS() { return ymd(nowReal()); }
function diff(a, b) { return Math.round((pd(b) - pd(a)) / 86400000); }
function fmtLong(s) { const d = pd(s); return DAYSL[dow(s)] + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()]; }
function fmtShort(s) { const d = pd(s); return d.getDate() + ' de ' + MONTHS[d.getMonth()]; }
function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }
function daysToWeekend(s) { const d = dow(s); return d >= 5 ? 0 : 5 - d; }       // días hasta el sábado
function schoolLeftAfter(s) { const d = dow(s); return d >= 4 ? 0 : 4 - d; }      // días de escuela que quedan después de s

const TTS = { voice: null };
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  if (!vs.length) return;
  const score = v => {
    let s = 0;
    if (/es[-_](EC|MX|US|419)/i.test(v.lang)) s += 3; else if (/es[-_]ES/i.test(v.lang)) s += 1;
    if (/paulina|sabina|helena|monica|m[oó]nica|luciana|marisol|google|female|mujer|laura|elena|paloma|camila|lupe/i.test(v.name)) s += 4;
    if (/jorge|diego|juan|carlos|male|hombre|pablo/i.test(v.name)) s -= 3;
    if (!v.localService) s += 0.5;
    return s;
  };
  TTS.voice = vs.sort((a, b) => score(b) - score(a))[0];
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

}

  const rate = o.rate || 1, pitch = o.pitch || 1.25, token = ++speakToken;
  return new Promise(res => {
    const fin = () => { if (token === speakToken) setTalking(false); res(); };
    if (!S.voice || !('speechSynthesis' in window)) {
      setTalking(true); setTimeout(fin, Math.min(4200, 900 + text.length * 38)); return;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = (TTS.voice && TTS.voice.lang) || 'es-EC'; if (TTS.voice) u.voice = TTS.voice;
      u.rate = rate; u.pitch = pitch; u.volume = 1;
      let done = false;
      const end = () => { if (done) return; done = true; clearTimeout(fail); fin(); };
      const fail = setTimeout(end, Math.max(3500, text.length * 105 / rate) + 2500);
      u.onstart = () => { if (token === speakToken) setTalking(true); };
      u.onend = end; u.onerror = end;

      setTimeout(() => { if (token === speakToken) speechSynthesis.speak(u); else end(); }, 40);
    } catch (e) { fin(); }
  });
}

_S.push({ t: 'Ricitos de Oro y los tres osos', icon: 'bowl', c: '#FFB703', cat: ['clasicos'], tx: `

_S.push({ t: 'El patito feo', icon: 'sun', c: '#2EC4B6', cat: ['clasicos'], tx: `

_S.push({ t: 'La Cenicienta', icon: 'star', c: '#9B5DE5', cat: ['clasicos', 'magia'], tx: `

_S.push({ t: 'El gato con botas', icon: 'jacket', c: '#F28C1B', cat: ['clasicos', 'magia'], tx: `

_S.push({ t: 'Jack y las habichuelas mágicas', icon: 'plant', c: '#55A630', cat: ['clasicos', 'magia'], tx: `

/* =====================================================================
   CEREBRO: entender preguntas (local, sin internet), micrófono, eventos, arranque

const ACC_MAP = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ü': 'u', 'ñ': 'n' };
const norm = t => t.toLowerCase().replace(/[áéíóúüñ]/g, c => ACC_MAP[c]);
const MONTHS_N = MONTHS.map(norm).concat(['setiembre']);
const WD_N = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
const NUMW = { cero: 0, uno: 1, un: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12 };
const STOP = new Set(['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo', 'santo', 'dia', 'del', 'de', 'la', 'el', 'los', 'las', 'primer', 'grito', 'para', 'cuando', 'cuanto', 'cuantos', 'faltan', 'falta', 'tiempo', 'proximo', 'siguiente', 'tengo', 'como', 'estas', 'hoy', 'manana', 'semana', 'fin']);

/* ---------- fechas dichas con palabras ---------- */
function parseDateSpan(n, mode = 'future') {
  const t = todayS(); let m;
  const tomorrowRe = /(^|[^a-z])(pasado manana|manana|anteayer|antes de ayer|ayer|hoy)(?![a-z])/;
  if ((m = n.match(/\b(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?: de (\d{4}))?/))) {
    const mo = MONTHS_N.indexOf(m[2]) % 12, d = +m[1]; let y = m[3] ? +m[3] : pd(t).getFullYear();
    let s = `${y}-${p2(mo + 1)}-${p2(d)}`;
    if (!m[3] && s < t && mode === 'future') s = `${y + 1}-${p2(mo + 1)}-${p2(d)}`;
    return { date: s, s: m.index, e: m.index + m[0].length };
  }
  if ((m = n.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/))) {
    const d = +m[1], mo = +m[2]; let y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : pd(t).getFullYear();
    let s = `${y}-${p2(mo)}-${p2(d)}`;
    if (!m[3] && s < t && mode === 'future') s = `${y + 1}-${p2(mo)}-${p2(d)}`;
    return { date: s, s: m.index, e: m.index + m[0].length };
  }
  const mm = n.replace(/\b(la|de la|en la|por la) manana\b/g, m0 => ' '.repeat(m0.length)).match(tomorrowRe);
  if (mm) {
    const off = { 'pasado manana': 2, manana: 1, hoy: 0, ayer: -1, anteayer: -2, 'antes de ayer': -2 }[mm[2]];
    return { date: addD(t, off), s: mm.index + mm[1].length, e: mm.index + mm[0].length };
  }
  if ((m = n.match(/\b(?:el |este |proximo |siguiente |pasado )?(lunes|martes|miercoles|jueves|viernes|sabado|domingo)(?: (pasado|proximo|que viene))?\b/))) {
    const idx = WD_N.indexOf(m[1]), ws = wstart(t); let d = addD(ws, idx);
    if (mode === 'past' || /pasado/.test(m[0])) { if (d > t || /pasado/.test(m[0]) && d >= t) d = addD(d, -7); }
    else { if (d < t) d = addD(d, 7); if (/proximo|siguiente|que viene/.test(m[0]) && d === t) d = addD(d, 7); }
    return { date: d, s: m.index, e: m.index + m[0].length };
  }
  if ((m = n.match(/\bel (\d{1,2})\b/))) {
    const d = +m[1], cur = pd(t); let y = cur.getFullYear(), mo = cur.getMonth();
    if (d >= 1 && d <= 31) {
      let s = `${y}-${p2(mo + 1)}-${p2(d)}`;
      if (s < t && mode === 'future') { mo++; if (mo > 11) { mo = 0; y++; } s = `${y}-${p2(mo + 1)}-${p2(d)}`; }
      return { date: s, s: m.index, e: m.index + m[0].length };
    }
  }
  return null;
}

/* ---------- frases de tiempo ---------- */
function daysWord(d) { return d === 0 ? 'hoy' : d === 1 ? 'mañana' : `en ${d} días`; }
function whenPhrase(ev) {
  const d = diff(todayS(), ev.date), tt = ev.title;
  let s;
  if (d < 0) s = `${tt} fue el ${fmtLong(ev.date)}.`;
  else if (d === 0) s = `¡${tt} es hoy!`;
  else if (d === 1) s = `¡${tt} es mañana, ${fmtLong(ev.date)}!`;
  else s = `Faltan ${d} días para ${tt}, que es el ${fmtLong(ev.date)}.`;
  if (ev.approx && d >= 0) s += ' Esa fecha puede moverse un poquito, pregúntale a mamá o papá.';
  return s;
}
function findEvent(n) {
  const t = todayS(), fut = allEvents().filter(e => e.date >= t);
  let type = null;
  if (/feriado|festivo|asueto/.test(n)) type = 'feriado'; else if (/cumple/.test(n)) type = 'cumple'; else if (/vacacion/.test(n)) type = 'vacaciones';
  else if (/\b(plan|paseo|salida|fiesta|visita|evento)\b/.test(n)) type = 'plan';
  const byTitle = fut.filter(e => norm(e.title).split(/[^a-z0-9]+/).some(w => w.length >= 4 && !STOP.has(w) && n.includes(w)));
  if (byTitle.length) return { ev: byTitle[0], type: null };
  if (type) { const l = fut.filter(e => e.type === type); return { ev: l[0] || null, type }; }
  return null;
}

/* ---------- acciones sobre la pantalla ---------- */
function refresh() { renderWeek(); renderHorario(); renderRoutine('m'); renderRoutine('t'); renderStars(); renderCalIfOpen(); hydrate(document); }

function goto(id) {

const STEPKW = { levantarme: /levant|despert/, cambiarme: /cambi|vest/, desayunar: /desayun/, peinarme: /peina/, dientes: /diente|cepill/, escuela: /salir|salid/, llegar: /lleg/, merendar: /meriend/, dormir: /dorm/ };
function sectionLabel(k) { return k === 'm' ? 'la mañana' : 'la tarde'; }

async function voiceMark(raw, n) {
  const undo = /desmarca|quita|borra|saca/.test(n), v = !undo;
  const n2 = n.replace(/\b(la|de la|en la|por la|tareas de la|rutina de la) manana\b/g, m0 => m0.replace('manana', 'MORNING'));
  const morning = /MORNING|rutina de (la )?manana/.test(n2), afternoon = /\btarde\b/.test(n);
  const wantAll = /todo|todas|completo|completa|completos/.test(n);
  const schoolDay = /(dia de (escuela|clases)|dia escolar|termine las clases|ya (termine|acabe)( la)? (escuela|clases)|volvi de la escuela|ya sali de clases)/.test(n);
  const past = /(dias?|dia) (que )?(ya )?(pasaron|pasados|pasado)|dias anteriores|dias que ya pasaron/.test(n);
  if (past) {
    const ok = await askConfirm('¿Marcar los días pasados?', 'Voy a marcar como cumplidas las rutinas y la escuela de los días que ya pasaron esta semana.', 'Sí, márcalos', 'No');
    if (!ok) return say('Está bien, no marqué nada.');

  }
  const sp = parseDateSpan(n2, 'past'); const date = sp ? sp.date : todayS();

  const stepIds = Object.keys(STEPKW).filter(id => STEPKW[id].test(n));
  const did = [];
  if (schoolDay && !stepIds.includes('escuela')) {
    if (dow(date) >= 5) return say('Ese día no hay escuela.');
    if (v) { S.school[date] = true; } else delete S.school[date]; save(); did.push('el día de escuela');
  }
  if (stepIds.length && !wantAll) {
    const hr = nowReal().getHours();
    stepIds.forEach(id => {
      let kinds = sections.length ? sections : ['m', 't'].filter(k => stepsFor(k, date).some(s => s.id === id));
      if (kinds.length > 1) kinds = [hr < 13 && date === todayS() ? 'm' : (date === todayS() ? 't' : 'm')];
      kinds.forEach(k => { if (stepsFor(k, date).some(s => s.id === id)) { setDone(date, k, id, v); did.push(stepsFor(k, date).find(s => s.id === id).label.toLowerCase()); } });
    });
  } else if (wantAll || sections.length || /dia/.test(n) && !schoolDay) {
    if (!sections.length) sections = ['m', 't'];

  setSel(date);
  const dText = date === todayS() ? 'hoy' : fmtLong(date);
  const full = ['m', 't'].filter(k => progress(date, k).all);
  const txt = v ? `¡Listo! Marqué ${did.join(', ')} de ${dText}.` : `Listo, quité ${did.join(', ')} de ${dText}.`;

}

async function voiceAddEvent(raw, n) {

function whatsMissing(date) {

  ['m', 't'].forEach(k => {
    const miss = stepsFor(k, date).filter(s => !isDone(date, k, s.id));

  });

}

function classesText(date) {
  const w = dow(date);
  if (w >= 5) return `El ${fmtLong(date)} no hay escuela. ¡A descansar y a jugar!`;
  const list = []; let last = '';
  for (let p = 0; p < 9; p++) { const s = SUBJ[TT[p][w]], nm = s[0]; if (nm !== last) list.push(nm); last = nm; }
  const cal = CALENTADOR.includes(w) ? ' Ese día te toca llevar el calentador.' : '';
  return `El ${fmtLong(date)} tienes: ${list.join(', ')}.${cal}`;

function arith(n) {
  const m = n.match(/(\d+|cero|uno|un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce) (mas|menos|por|x|multiplicado por) (\d+|cero|uno|un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)/);
  if (!m) return null;
  const a = isNaN(m[1]) ? NUMW[m[1]] : +m[1], b = isNaN(m[3]) ? NUMW[m[3]] : +m[3];
  if (m[2] === 'mas') return `${a} más ${b} es ${a + b}.`;
  if (m[2] === 'menos') return a >= b ? `${a} menos ${b} es ${a - b}.` : `Con ${a} no se pueden quitar ${b}. ¡Qué difícil!`;
  return `${a} por ${b} es ${a * b}.`;
}

    const sp = parseDateSpan(nMorning, 'future'); const d = sp ? sp.date : t;

  if (/cuanto (es|son|da)|cuanto \w+ (mas|menos|por)|\d+ (mas|menos|por|x) \d+/.test(n)) { const a = arith(n); if (a) return say2(a, { mood: 'happy' }); }
  // charla
  if (/(te quiero|te amo|eres (mi|la mejor)|eres linda|eres bonita)/.test(n)) { hearts(innerWidth / 2, innerHeight / 3); return say2(`¡Yo también te quiero mucho, ${name()}!`, { mood: 'wow' }); }
  if (/como te llamas|cual es tu nombre|quien eres|tu nombre/.test(n)) return say2(`Me llamo ${aname()}. ¡Soy tu amiga y te ayudo con tu horario, tus tareas y tus estrellas!`);
  if (/como (te )?llamo|cual es mi nombre/.test(n)) return say2(`¡Te llamas ${name()}!`);
  if (/como estas|como te sientes|que tal estas/.test(n)) return say2('¡Muy bien y muy contenta de verte!', { mood: 'wow' });
  if (/gracias/.test(n)) return say2('¡De nada! ¡Para eso estoy!');
  if (/adios|chao|hasta luego|nos vemos|buenas noches/.test(n)) return say2(/noches/.test(n) ? `Buenas noches, ${name()}. ¡Dulces sueños!` : `¡Hasta luego, ${name()}!`);
  if (/ayuda|que puedes hacer|que sabes|que haces|para que sirves/.test(n))
    return say2('Puedes preguntarme cuántos días faltan para el fin de semana o para un feriado, qué clases tienes, qué te falta hacer, cuántas estrellas llevas, o pedirme un cuento o un chiste. También puedes decirme: marca la mañana de hoy.');
  if (/^(hola|buenas|buenos dias|buen dia|buenas tardes|que tal|hey|oye)\b/.test(n)) return say2(greetingLine(), { mood: 'wow' });
  if (/triste|aburrida|aburrido/.test(n)) return say2(`No estés triste, ${name()}. ¿Quieres que te cuente un chiste o un cuento?`);
  return say2(pick([`Mmm, no entendí muy bien. Prueba a preguntarme: ¿cuántos días faltan para el fin de semana?`, `No estoy segura de eso, ${name()}. Puedo ayudarte con tu horario, tus tareas, tus estrellas, el calendario y los cuentos.`, `Todavía soy pequeña y no sé responder eso. ¿Me preguntas otra cosa?`]));
}

/* ---------- micrófono (escuchar) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, recLang = 'es-EC', recErr = '', recSafety = null;
function micUI(on) {
  ['#dockMic'].forEach(s => { const e = $(s); if (e) e.classList.toggle('live', on); });
}
function startListen(retry) {
  if (!SR) { toast('Este equipo no puede escuchar. ¡Escribe tu pregunta!'); openAsk(); return; }
  if (listening) { try { rec.stop(); } catch (e) { } return; }
  stopSpeaking(); audio();
  let finalText = '', interim = ''; recErr = '';
  try {
    rec = new SR(); rec.lang = recLang; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onstart = () => { listening = true; micUI(true); bubble('Te escucho…'); clearTimeout(recSafety); recSafety = setTimeout(() => { try { rec.stop(); } catch (e) { } }, 12000); };
    rec.onresult = e => {
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript + ' '; else interim += r[0].transcript; }
      $('#bubbleText').textContent = '“' + (finalText || interim).trim() + '”';
    };
    rec.onerror = e => { recErr = e.error; };
    rec.onend = () => {
      listening = false; micUI(false); clearTimeout(recSafety);
      const txt = (finalText || interim).trim();
      if (recErr === 'language-not-supported' && recLang !== 'es-419') { recLang = 'es-419'; return startListen(true); }
      if (recErr === 'not-allowed' || recErr === 'service-not-allowed') { toast('Necesito permiso para usar el micrófono.'); say(`Necesito permiso para escucharte. Pídele a mamá o a papá que active el micrófono. Mientras tanto, puedes escribirme.`, { mood: 'sad' }); return; }
      if (recErr === 'network') { say('Para escucharte necesito internet. Mientras tanto, puedes escribirme tu pregunta.', { mood: 'sad' }); return; }
      if (txt) handleQuery(txt); else say(`No te escuché bien, ${name()}. ¿Lo intentamos otra vez?`, { mood: 'sad' });
    };
    rec.start();
  } catch (e) { listening = false; micUI(false); toast('No pude activar el micrófono. Escribe tu pregunta.'); }
}

/* ---------- bienvenida (primera vez) ---------- */
let onbChar = 'violeta';
function renderOnbChars() {
  $('#onbChars').innerHTML = ['violeta', 'oso', 'fantasma'].map(k => `<button data-act="onb-char" data-k="${k}" class="${onbChar === k ? 'on' : ''}"><div class="av" data-kind="${k}"></div>${{ violeta: 'Niña', oso: 'Osito', fantasma: 'Fantasmita' }[k]}</button>`).join('');
  mountAvatars();
}
function showOnb() { $('#onb').classList.remove('hidden'); onbChar = S.character || 'violeta'; renderOnbChars(); }
async function finishOnb() {
  const a = $('#onbName').value.trim().slice(0, 20), c = $('#onbChild').value.trim().slice(0, 24) || 'Violeta';
  if (!a) { const i = $('#onbName'); i.classList.add('shake'); setTimeout(() => i.classList.remove('shake'), 600); i.focus(); toast('¡Escríbeme un nombre!'); return; }
  S.assistant = a; S.child = c; S.character = onbChar; S.onboarded = true; save();
  $('#onb').classList.add('hidden'); mountAvatars(); renderAll(); sfx.win(); confetti(60, true); audio();
  const txt = `¡Hola ${c}! Me llamo ${a}. Voy a ser tu amiga y te ayudaré con tu horario, tus tareas y tus estrellas. ¡Vamos a divertirnos!`;
  window.scrollTo(0, 0);
  await say(txt, { mood: 'wow' });
}

const CHAR_NAMES = { violeta: 'una niña', oso: 'el osito', fantasma: 'el fantasmita' };
function charReact(k) {
  ['#onbAv', '#dockAv', '#heroAv'].forEach(s => { const e = $(s); if (e) bounce(e.parentElement, 'megabounce'); });
  sfx.pop(); confetti(18, true);
  say(`¡Hola ${name()}! Ahora soy ${CHAR_NAMES[k]}. ¡Vamos a jugar!`, { mood: 'wow', bounce: false });
}
/* ---------- eventos ---------- */
const PHRASES = ['¡Hola! ¿Jugamos?', '¡Qué cosquillas!', '¡Eres la mejor!', 'Pregúntame lo que quieras', '¡Vamos a tener un gran día!', '¡Me encanta ayudarte!'];
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'open-cal': openSheet('cal'); break;
    case 'open-set': openSheet('set'); break;
    case 'close-sheet': closeSheets(); break;
    case 'nav': goto(d.go); break;
    case 'avatar': { hearts(e.clientX, e.clientY); sfx.pop(); bounce(el, 'megabounce'); toggleAsk(); break; }
    case 'stage-av': hearts(e.clientX, e.clientY); bounce(el, 'megabounce'); sfx.pop(); break;
    case 'mic': closeAsk(); startListen(); break;
    case 'ask': closeAsk(); handleQuery(d.q); break;
    case 'wk-prev': setSel(addD(selDate, -7)); break;
    case 'wk-next': setSel(addD(selDate, 7)); break;
    case 'selday': dayOpen = true; setSel(d.date); break;
    case 'day-close': dayOpen = false; renderHorario(); break;
    case 'story-cat': storyCat = d.k; renderStories(); break;
    case 'close-ask': closeAsk(); break;
    case 'hide-bubble': $('#dockBubble').classList.remove('show'); break;
    case 'gotoday': setSel(todayS()); break;
    case 'icon-tap': bounce(el, 'megabounce'); burst(el, 8); sfx.pop(); break;
    case 'subj': {
      const p = +d.p, s = SUBJ[d.key], pic = el.querySelector('.pic');
      bounce(pic, 'megabounce'); burst(pic, 8); sfx.pop();
      say(`${s[0]}${s[1] ? ', ' + s[1] : ''}. Es la clase número ${p + 1}, de ${TIMES[p][0].replace('h', ' y ')} a ${TIMES[p][1].replace('h', ' y ')}.`.replace(/ y (\d{2})/g, (m0, mm) => mm === '00' ? ' en punto' : ' y ' + mm), { bounce: false });
      break;
    }
    case 'schoolday': schoolDayDone(selDate); break;
    case 'school-undo': delete S.school[selDate]; save(); refresh(); break;
    case 'togglegrid': gridOpen = !gridOpen; renderHorario(); break;
    case 'toggle': toggleTask(d.kind, d.id); break;
    case 'icon': iconTap(d.kind, d.id); break;
    case 'finish': finishSection(d.kind); break;
    case 'star': starTap(d.date); break;
    case 'prizes': sfx.pop(); prizeStage(selDate); break;
    case 'close-stage': closeStage(); break;
    case 'remove-star': {
      const dt = stageDate; closeStage();
      if (dt && await askConfirm('¿Quitar la estrella?', 'La estrella de este día volverá a estar vacía.', 'Sí, quitarla', 'No')) { delete S.stars[dt]; save(); refresh(); }
      break;
    }
    case 'stories-toggle': storiesOpen = !storiesOpen; renderStories(); break;
    case 'story': openStory(+d.i); break;
    case 'reader-back': closeReader(); break;
    case 'read-aloud': readAloud(); break;
    case 'read-self': stopReading(); toast('¡Toca las palabras para escucharlas!'); break;
    case 'font+': readScale = Math.min(2, readScale + .15); $('#rbody').style.fontSize = (1.35 * readScale) + 'rem'; break;
    case 'font-': readScale = Math.max(.8, readScale - .15); $('#rbody').style.fontSize = (1.35 * readScale) + 'rem'; break;
    case 'word': { el.style.background = '#FFE49A'; setTimeout(() => el.style.background = '', 900); speak(d.w.replace(/[.,«»¡!¿?]/g, ''), { rate: .65, pitch: 1.2 }); break; }
    case 'cal-prev': case 'cal-next': {
      const [y, m] = calMonth.split('-').map(Number), dt = new Date(y, m - 1 + (a === 'cal-next' ? 1 : -1), 1);
      calMonth = ymd(dt).slice(0, 7); renderCal(); break;
    }
    case 'cal-day': calSel = d.date; calMonth = d.date.slice(0, 7); renderCal(); break;
    case 'cal-del': S.events = S.events.filter(x => x.id !== d.id); save(); renderCal(); break;
    case 'cal-type': calType = d.t; $$('.tchips button').forEach(b => b.classList.toggle('on', b.dataset.t === calType)); break;
    case 'cal-add': {
      const inp = $('#evTitle'), v = inp.value.trim();
      if (!v) { toast('Escribe qué plan es'); inp.focus(); break; }
      addEvent(calSel, v, calType); sfx.pop(); toast('Guardado en el calendario'); say(`¡Listo! Anoté «${v}» para el ${fmtLong(calSel)}.`);
      break;
    }
    case 'set-char': S.character = d.k; save(); mountAvatars(); renderSettings(); charReact(d.k); break;
    case 'avatar-play': hearts(e.clientX, e.clientY); bounce(el, 'megabounce'); sfx.pop(); break;
    case 'set-voice': S.voice = !S.voice; save(); if (!S.voice) stopSpeaking(); renderSettings(); break;
    case 'set-sound': S.sound = !S.sound; save(); renderSettings(); break;
    case 'set-test': say(`¡Hola ${name()}! Soy ${aname()}. ¿Me escuchas bien?`); break;
    case 'set-past': {
      if (await askConfirm('¿Marcar días pasados?', 'Se marcarán como cumplidas las rutinas y la escuela de los días que ya pasaron esta semana.', 'Sí, marcar', 'No')) { const k = pastDays(); refresh(); toast(k ? `Se marcaron ${k} días` : 'Todavía no hay días pasados'); }
      break;
    }
    case 'set-install': if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => { }); deferredInstall = null; renderSettings(); } break;
    case 'set-reset': {
      if (await askConfirm('¿Borrar todo?', 'Se borrarán tareas, estrellas, planes y nombres de este dispositivo. No se puede deshacer.', 'Sí, borrar todo', 'No')) {
        try { localStorage.removeItem(KEY); } catch (er) { }
        location.href = location.pathname;
      }
      break;
    }
    case 'onb-char': onbChar = d.k; S.character = d.k; renderOnbChars(); charReact(d.k); break;
    case 'onb-go': finishOnb(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'setAssist') { S.assistant = e.target.value.trim().slice(0, 20); save(); }
  if (e.target.id === 'setChild') { S.child = e.target.value.trim().slice(0, 24) || 'Violeta'; save(); $('#hello').textContent = 'Hola, ' + name(); }
});
function openAsk() { $('#askpanel').classList.add('open'); setTimeout(() => $('#askinput').focus(), 80); }
function closeAsk() { $('#askpanel').classList.remove('open'); $('#askinput').blur(); }
function toggleAsk() { $('#askpanel').classList.contains('open') ? closeAsk() : openAsk(); }
document.addEventListener('pointerdown', e => { if ($('#askpanel').classList.contains('open') && !e.target.closest('#dock')) closeAsk(); });
$('#askform').addEventListener('submit', e => { e.preventDefault(); const i = $('#askinput'), v = i.value; i.value = ''; closeAsk(); handleQuery(v); });
$('#onbName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#onbChild').focus(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#stage').classList.contains('open')) closeStage(); else if ($('#reader').classList.contains('open')) closeReader(); else closeSheets(); }
});

/* ---------- arranque ---------- */
function updateNavActive() {
  const off = ($('.sticky') || { offsetHeight: 0 }).offsetHeight + 40; let cur = '';
  ['horario', 'manana', 'tarde', 'estrellas', 'cuentos'].forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= off) cur = id; });
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === cur));
}
let lastToday = todayS();
function rollover() {
  const t = todayS();
  if (t !== lastToday) { if (selDate === lastToday) selDate = t; lastToday = t; refresh(); bubble(greetingLine()); }
  else if (selDate === t) { renderHorario(); hydrate($('#horario')); }
}
function init() {
  mountAvatars(); renderChips(); renderAll(); mountAvatars(); updateNavActive();
  window.addEventListener('scroll', updateNavActive, { passive: true });
  if (!S.onboarded) showOnb(); else setTimeout(() => bubble(greetingLine()), 700);
  setInterval(rollover, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rollover(); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script></body></html>
